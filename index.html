    <script>
      (function() {
        var COFFEE_URL = '/coffee/index.html';

        function openCoffee() {
          var overlay = document.getElementById('bmc-overlay');
          var iframe  = document.getElementById('bmc-iframe');
          if (!iframe.src || iframe.src === window.location.href) {
            iframe.src = COFFEE_URL;
          }
          overlay.classList.add('bmc-open');
          document.body.style.overflow = 'hidden';
        }

        function closeCoffee() {
          document.getElementById('bmc-overlay').classList.remove('bmc-open');
          document.body.style.overflow = '';
        }

        document.getElementById('bmc-overlay-close').addEventListener('click', closeCoffee);
        document.getElementById('bmc-overlay').addEventListener('click', function(e) {
          if (e.target === this) closeCoffee();
        });
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') closeCoffee();
        });

        function createNavBtn() {
          var btn = document.createElement('button');
          btn.id = 'bmc-nav-btn';
          btn.setAttribute('aria-label', 'Buy Me Coffee');
          btn.innerHTML = '<span class="bmc-icon">☕</span> Buy Me Coffee';
          btn.addEventListener('click', openCoffee);
          return btn;
        }

        function createHeroBtn() {
          var btn = document.createElement('button');
          btn.id = 'bmc-hero-btn';
          btn.setAttribute('aria-label', 'Buy Me Coffee');
          btn.innerHTML = '☕ BUY ME COFFEE';
          btn.addEventListener('click', openCoffee);
          // Style matches the HIRE ME hero button look
          btn.style.cssText = [
            'display:inline-flex',
            'align-items:center',
            'gap:8px',
            'padding:14px 28px',
            'background:transparent',
            'color:#f97316',
            'border:1.5px solid #f97316',
            'border-radius:4px',
            'font-size:0.8rem',
            'font-weight:700',
            'letter-spacing:0.12em',
            'cursor:pointer',
            'text-transform:uppercase',
            'white-space:nowrap',
            'font-family:Inter,sans-serif',
            'transition:all 0.2s ease',
            'box-shadow:0 0 0 transparent'
          ].join(';');
          btn.addEventListener('mouseenter', function() {
            this.style.background = '#f97316';
            this.style.color = '#fff';
            this.style.boxShadow = '0 0 18px rgba(249,115,22,0.45)';
          });
          btn.addEventListener('mouseleave', function() {
            this.style.background = 'transparent';
            this.style.color = '#f97316';
            this.style.boxShadow = '0 0 0 transparent';
          });
          return btn;
        }

        function injectIntoHero() {
          // Find the hero row containing WATCH REEL / PORTFOLIO / HIRE ME buttons
          var allBtns = document.querySelectorAll('a, button');
          var hireHeroEl = null;
          // Find the HIRE ME in the hero (not in nav — it's usually inside a section/main)
          for (var i = 0; i < allBtns.length; i++) {
            var txt = allBtns[i].textContent.trim().toUpperCase();
            if ((txt === 'HIRE ME' || txt === 'HIRE ME') && !allBtns[i].closest('nav') && !allBtns[i].closest('header')) {
              hireHeroEl = allBtns[i];
              break;
            }
          }
          if (hireHeroEl && !document.getElementById('bmc-hero-btn')) {
            var heroBtn = createHeroBtn();
            hireHeroEl.parentNode.insertBefore(heroBtn, hireHeroEl.nextSibling);
            return true;
          }
          return false;
        }

        function injectIntoNav() {
          // Find HIRE ME in the nav/header specifically
          var allLinks = document.querySelectorAll('nav a, nav button, header a, header button');
          var hireEl = null;
          for (var i = 0; i < allLinks.length; i++) {
            var txt = allLinks[i].textContent.trim().toLowerCase();
            if (txt.includes('hire') || txt === 'hire me') {
              hireEl = allLinks[i];
              break;
            }
          }
          // fallback: search all
          if (!hireEl) {
            var all = document.querySelectorAll('a, button');
            for (var j = 0; j < all.length; j++) {
              var t = all[j].textContent.trim().toLowerCase();
              if (t === 'hire me' || t === 'hire') { hireEl = all[j]; break; }
            }
          }

          if (hireEl && !document.getElementById('bmc-nav-btn')) {
            var navBtn = createNavBtn();
            hireEl.parentNode.insertBefore(navBtn, hireEl.nextSibling);
            return true;
          }

          // Fallback: end of nav
          var nav = document.querySelector('nav') || document.querySelector('header');
          if (nav && !document.getElementById('bmc-nav-btn')) {
            nav.appendChild(createNavBtn());
            return true;
          }

          return false;
        }

        function injectFooterCTA() {
          if (document.getElementById('bmc-footer-cta')) return false;

          var cta = document.createElement('section');
          cta.id = 'bmc-footer-cta';
          cta.style.cssText = 'padding: 80px 20px; background: #050505; border-top: 1px solid rgba(255,255,255,0.05); text-align: center; color: #fff; font-family: "Inter", sans-serif; position: relative; z-index: 10; margin-top: auto;';
          
          cta.innerHTML = `
            <div style="max-width: 800px; margin: 0 auto;">
              <h2 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 20px; color: #fff; letter-spacing: -0.02em;">START A PROJECT</h2>
              <p style="font-size: 1.1rem; color: #a3a3a3; margin-bottom: 35px; line-height: 1.6;">
                Ready to elevate your brand? Fill out the form below or contact me directly.<br/>
                Book for a reliable virtual assistant, let's describe your personal needs.
              </p>
              <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;">
                <a href="mailto:georgemuraguri19@gmail.com" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border: 1px solid #333; border-radius: 4px; color: #fff; text-decoration: none; font-weight: 600; transition: all 0.2s;" onmouseover="this.style.borderColor='#fff'; this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.borderColor='#333'; this.style.background='transparent'">✉️ Email</a>
                <a href="https://www.upwork.com/freelancers/~018adabc1e2a7601e1?mp_source=share" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border: 1px solid #14a800; border-radius: 4px; color: #14a800; text-decoration: none; font-weight: 600; transition: all 0.2s;" onmouseover="this.style.background='#14a800'; this.style.color='#fff'" onmouseout="this.style.background='transparent'; this.style.color='#14a800'">💼 Upwork</a>
                <a href="https://wa.me/254799553292" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border: 1px solid #25D366; border-radius: 4px; color: #25D366; text-decoration: none; font-weight: 600; transition: all 0.2s;" onmouseover="this.style.background='#25D366'; this.style.color='#fff'" onmouseout="this.style.background='transparent'; this.style.color='#25D366'">💬 WhatsApp</a>
                <button onclick="document.getElementById('bmc-overlay').classList.add('bmc-open'); document.body.style.overflow='hidden';" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); border: none; border-radius: 4px; color: #fff; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(249,115,22,0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 6px 20px rgba(249,115,22,0.5)'" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(249,115,22,0.3)'">☕ Buy Me Coffee</button>
              </div>
            </div>
          `;
          
          var root = document.getElementById('root');
          if (root) {
            root.appendChild(cta);
          } else {
            document.body.appendChild(cta);
          }
          return true;
        }

        function tryInject() {
          var navDone  = injectIntoNav();
          var heroDone = injectIntoHero();
          injectFooterCTA(); // Always try to inject the footer CTA

          if (!navDone && !heroDone) {
            // Show floating button as last fallback
            var floatBtn = document.getElementById('bmc-float-btn');
            floatBtn.style.display = 'flex';
            floatBtn.addEventListener('click', openCoffee);
          }
        }

        // React renders async — observe DOM until nav appears
        var injected = false;
        var observer = new MutationObserver(function() {
          if (injected) return;
          if (document.querySelector('nav') || document.querySelector('header')) {
            setTimeout(function() {
              if (!injected) {
                injected = true;
                tryInject();
                observer.disconnect();
              }
            }, 400);
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });

        // Hard fallback — 5s
        setTimeout(function() {
          if (!injected) {
            injected = true;
            observer.disconnect();
            tryInject();
          }
        }, 5000);
      })();
    </script>

    <style>

    <script>
        /* ----------------------
           Audio helpers (WebAudio) — defensive and robust
           ---------------------- */
        let audioCtx = null;
        function ensureAudioContext(){
            if(!audioCtx || (audioCtx.state === 'closed')){
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function _num(v, fallback){
            const n = Number(v);
            return Number.isFinite(n) ? n : fallback;
        }

        function _safeStartOscillator(ctx, osc, startAt){
            try{ osc.start(startAt); }catch(e){ try{ osc.start(); }catch(e2){} }
        }

        function playChime(opts){
            const oopts = opts || {};
            const frequency = _num(oopts.frequency, 880);
            const duration = Math.max(0.02, _num(oopts.duration, 0.18));
            const whenOff = _num(oopts.when, 0);
            const detune = _num(oopts.detune, -100);

            const ctx = ensureAudioContext();
            const now = Number.isFinite(ctx.currentTime) ? ctx.currentTime : 0;
            const startTime = now + whenOff;

            const o = ctx.createOscillator();
            const g = ctx.createGain();

            try{ o.type = 'sine'; }catch(e){}
            try{ if(Number.isFinite(frequency)) o.frequency.value = frequency; }catch(e){}
            try{ if(Number.isFinite(detune)) o.detune.value = detune; }catch(e){}

            o.connect(g); g.connect(ctx.destination);

            const tiny = 0.00001;
            const peak = 0.15;
            try{ g.gain.setValueAtTime(tiny, startTime); }catch(e){ try{ g.gain.value = tiny }catch(e){} }
            try{ g.gain.exponentialRampToValueAtTime(peak, startTime + 0.01); }catch(e){ try{ g.gain.linearRampToValueAtTime(peak, startTime + 0.01); }catch(e){} }
            try{ g.gain.exponentialRampToValueAtTime(tiny, startTime + duration); }catch(e){ try{ g.gain.linearRampToValueAtTime(tiny, startTime + duration); }catch(e){} }

            _safeStartOscillator(ctx, o, startTime);
            try{ o.stop(startTime + duration + 0.02); }catch(e){ /* ignore */ }
        }

        function playPulse(opts){
            const oopts = opts || {};
            const frequency = _num(oopts.frequency, 220);
            const duration = Math.max(0.02, _num(oopts.duration, 0.32));

            const ctx = ensureAudioContext();
            const now = Number.isFinite(ctx.currentTime) ? ctx.currentTime : 0;
            const startTime = now;

            const o = ctx.createOscillator();
            const g = ctx.createGain();
            try{ o.type = 'triangle'; }catch(e){}
            try{ if(Number.isFinite(frequency)) o.frequency.value = frequency; }catch(e){}

            o.connect(g); g.connect(ctx.destination);

            const tiny = 0.00001;
            try{ g.gain.setValueAtTime(tiny, startTime); }catch(e){ try{ g.gain.value = tiny }catch(e){} }
            try{ g.gain.linearRampToValueAtTime(0.12, startTime + 0.02); }catch(e){}
            try{ g.gain.linearRampToValueAtTime(tiny, startTime + duration); }catch(e){}

            _safeStartOscillator(ctx, o, startTime);
            try{ o.stop(startTime + duration + 0.02); }catch(e){}
        }

        /* ----------------------
           Intersection Observer to trigger section reveal + sounds
           ---------------------- */
        const sections = document.querySelectorAll('.brand-section');
        const options = { root: null, rootMargin: '0px', threshold: 0.45 };

        const onIntersect = (entries)=>{
            entries.forEach(entry => {
                const id = entry.target.id;
                if(entry.isIntersecting){
                    entry.target.classList.add('inview');
                    entry.target.classList.remove('outview');
                    try{
                        switch(id){
                            case 'nexus': playChime({frequency:920,duration:.16,detune:-40}); break;
                            case 'aethereal': playChime({frequency:640,duration:.26,detune:40}); break;
                            case 'vela': playPulse({frequency:180,duration:.28}); break;
                            case 'lumen': playChime({frequency:540,duration:.22,detune:-10}); break;
                            case 'about': playChime({frequency:720,duration:.12}); break;
                        }
                    }catch(e){ console.warn('Audio trigger failed', e); }
                } else {
                    entry.target.classList.remove('inview');
                    entry.target.classList.add('outview');
                }
            })
        }

        const observer = new IntersectionObserver(onIntersect, options);
        sections.forEach(s => { s.classList.add('outview'); observer.observe(s); });

        function smoothScrollTo(id){
            const el = document.getElementById(id);
            if(!el) return;
            el.scrollIntoView({behavior:'smooth', block:'center'});
        }

        document.querySelectorAll('.nav-btn').forEach(btn=>{
            btn.addEventListener('click', e=>{
                const t = btn.getAttribute('data-target');
                smoothScrollTo(t);
            })
        });

        const dotsWrap = document.getElementById('dots');
        const ids = ['nexus','aethereal','vela','lumen','about'];
        ids.forEach(id=>{
            const el = document.createElement('div');
            el.classList.add('w-3','h-3','rounded-full','bg-white/20');
            el.setAttribute('data-target',id);
            el.style.cursor = 'pointer';
            el.addEventListener('click',()=>smoothScrollTo(id));
            dotsWrap.appendChild(el);
        });

        const updateDots = ()=>{
            const mid = window.innerHeight/2 + window.scrollY;
            let active = 0;
            sections.forEach((s,i)=>{
                const r = s.getBoundingClientRect();
                const top = r.top + window.scrollY;
                const bottom = top + r.height;
                if(mid >= top && mid <= bottom) active = i;
            });
            Array.from(dotsWrap.children).forEach((d,i)=>{
                d.className = i===active? 'dot-active':'w-3 h-3 rounded-full bg-white/20';
            })
        }

        window.addEventListener('scroll', updateDots);
        window.addEventListener('resize', updateDots);
        updateDots();

        function replayVisible(){
            const mid = window.innerHeight/2 + window.scrollY;
            let visible = null;
            sections.forEach(s=>{
                const r = s.getBoundingClientRect();
                const top = r.top + window.scrollY;
                const bottom = top + r.height;
                if(mid >= top && mid <= bottom) visible = s;
            });
            if(!visible) return;
            visible.classList.remove('inview');
            void visible.offsetWidth; // trigger reflow
            visible.classList.add('inview');
            try{ playChime({frequency:760,duration:.12}); }catch(e){}
        }

        document.addEventListener('keydown', e=>{
            if(e.key === 'r') replayVisible();
        });

        const enableAudioBtn = document.getElementById('enableAudioBtn');
        if(enableAudioBtn){
            enableAudioBtn.addEventListener('click', async ()=>{
                try{
                    ensureAudioContext();
                    if(audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
                    try{ playChime({frequency:1000,duration:.12}); }catch(e){}
                    enableAudioBtn.innerText = 'Audio enabled';
                    enableAudioBtn.classList.add('bg-green-600','text-white');
                }catch(err){
                    console.warn('Audio enable failed', err);
                }
            });
        }

        window.addEventListener('load', ()=>{
            const h = 'nexus';
            setTimeout(()=>{ if(document.getElementById(h)) document.getElementById(h).scrollIntoView({behavior:'auto', block:'center'}) }, 80);
        });

        const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
        if(mq.matches){
            document.documentElement.style.scrollBehavior = 'auto';
        }

    <\/script>
</body>
</html>`;

    // 3D Abstract Animation Code
    const abstractDemoCode = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Motion Graphics Generator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.8rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="info">Interactive Abstract Motion <br> <span style="font-size: 0.6em; opacity: 0.6;">Move Mouse to Rotate</span></div>
    
    <!-- Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>

    <script>
        let scene, camera, renderer;
        let geometry, material, mesh, wireframe;
        let particles, particleSystem;
        let clock;
        
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 50;

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. Main Abstract Object (Morphing Sphere)
            // We use an Icosahedron as the base for a "digital organism" look
            const radius = 15;
            const detail = 2; // Higher detail = more vertices to animate
            geometry = new THREE.IcosahedronGeometry(radius, detail);

            // Store original positions for morphing reference
            geometry.userData = { originalPositions: [] };
            const positionAttribute = geometry.getAttribute('position');
            
            for (let i = 0; i < positionAttribute.count; i++) {
                geometry.userData.originalPositions.push(
                    new THREE.Vector3(
                        positionAttribute.getX(i),
                        positionAttribute.getY(i),
                        positionAttribute.getZ(i)
                    )
                );
            }

            // Material: Shiny, dark, reflective
            material = new THREE.MeshPhongMaterial({
                color: 0x222222,
                emissive: 0x111111,
                specular: 0x666666,
                shininess: 60,
                flatShading: true
            });

            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Wireframe Overlay (The "Neon" look)
            const wireframeMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ff88, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            wireframe = new THREE.Mesh(geometry, wireframeMaterial);
            // Make wireframe slightly larger to prevent z-fighting
            wireframe.scale.setScalar(1.01);
            scene.add(wireframe);

            // 5. Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x0088ff, 2, 100);
            pointLight1.position.set(20, 20, 20);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xff0088, 2, 100);
            pointLight2.position.set(-20, -20, 20);
            scene.add(pointLight2);

            // 6. Particle System (Background noise)
            const particleCount = 1000;
            const particlesGeometry = new THREE.BufferGeometry();
            const particlePositions = [];

            for (let i = 0; i < particleCount; i++) {
                const x = (Math.random() - 0.5) * 200;
                const y = (Math.random() - 0.5) * 200;
                const z = (Math.random() - 0.5) * 200;
                particlePositions.push(x, y, z);
            }

            particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particlePositions, 3));
            
            const particlesMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5,
                transparent: true,
                opacity: 0.5
            });

            particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particleSystem);

            // 7. Event Listeners
            clock = new THREE.Clock();
            document.addEventListener('mousemove', onDocumentMouseMove);
            window.addEventListener('resize', onWindowResize);
        }

        function onDocumentMouseMove(event) {
            mouseX = (event.clientX - windowHalfX) * 0.05;
            mouseY = (event.clientY - windowHalfY) * 0.05;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            render();
        }

        function render() {
            const time = clock.getElapsedTime();

            // 1. Smooth Camera Movement based on Mouse
            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;
            
            mesh.rotation.y += 0.005;
            mesh.rotation.x += 0.002;
            wireframe.rotation.y = mesh.rotation.y;
            wireframe.rotation.x = mesh.rotation.x;

            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            // 2. Vertex Manipulation (The "Breathing" Effect)
            const positionAttribute = geometry.getAttribute('position');
            const originalPositions = geometry.userData.originalPositions;

            for (let i = 0; i < positionAttribute.count; i++) {
                const oldPos = originalPositions[i];
                
                // Create a noise-like pattern using sine waves
                // We use the vertex position and time to create a "wave" that travels across the mesh
                const spike = Math.sin(oldPos.x * 0.5 + time * 2) * Math.cos(oldPos.y * 0.5 + time * 1.5) * Math.sin(oldPos.z * 0.5 + time) * 3;

                // Normalize the vector to push it outward from center
                const v = new THREE.Vector3(oldPos.x, oldPos.y, oldPos.z);
                v.normalize();
                
                // Apply the spike magnitude
                const distance = 15 + spike; // Base radius 15 + modulation
                
                positionAttribute.setXYZ(i, v.x * distance, v.y * distance, v.z * distance);
            }
            
            positionAttribute.needsUpdate = true;
            geometry.computeVertexNormals(); // Re-calculate lighting shadows

            // 3. Pulse Lights
            scene.children.forEach(child => {
                if (child.isPointLight) {
                    child.intensity = 2 + Math.sin(time * 3) * 0.5;
                }

</strong><br />&#39;cause we react differently.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />How would he say something?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />He gets a chance. He gets a chance.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Well, I&#39;m just, I&#39;m just teasing you. But I mean, really, &#39;cause it looks to me like this is putting that is just so much stress and pressure that it&#39;s putting big cracks in the foundation here. And I mean, are you willing to let that happen because you&#39;re saying, well, that&#39;s the way it&#39;s looking right now. That&#39;s not okay.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />I feel like the other woman; all his money goes to her for child support. All of it goes garnish. Nothing comes to my house. I pay all the bills. Now, anything that he brings home goes to court. I support everybody, I do everything. And when his kids come, I buy their clothes. I pay for them things for them to do. And so I feel like I&#39;m supporting them too. I just, I feel like I&#39;m the mistress or I&#39;m the other woman, and I&#39;m not. I&#39;m the wife, and I don&#39;t feel important at all.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Well, yeah, but you&#39;re --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />It&#39;s not protecting me --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />But you&#39;re choosing that. And what you&#39;ve got to do is negotiate something that both of you can be involved in and excited about.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Yes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />And you got to be willing to say something.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Yes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />&#39;Cause, I mean, you really you do talk a lot, but I get the feeling. I get the feeling. You wouldn&#39;t yell if your hair was on fire. I mean, you know, we got, we got to get you involved more with Destiny and David when we come back.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />He does, he does.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />We&#39;re talking to David and Destiny, and I ask you guys right before the break if all of these allegations, all of this stress, all of this pressure of being accused of wrongdoing with the children, which, I mean, that&#39;s like the worst thing you can be accused of, right? And in the Child Protective Services World, they necessarily have an attitude that says we would rather have a thousand false positives than miss one. That&#39;s true. And y&#39;all, I mean, you get that, don&#39;t you? That&#39;s a tough situation. We do want to protect the children, but there&#39;s a point at which you&#39;ve got to draw a line in the sand and say, we&#39;ll do what we have to to monitor a situation, but we&#39;re not gonna continue to beat people up over this thing. And it&#39;s a tough I mean, you recognize objectively that&#39;s a tough balance, don&#39;t you?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Yes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />I mean, &#39;cause let&#39;s assume that the accusations were true, and we know they&#39;re not. They have -- you&#39;ve been you have been cleared of those time, and time, and time again. But if they were true, you understand how important it would be for someone to tenaciously, doggedly get in there and rescue that child, right, and protect them. So we do want our child Protective Services people to do those kind of things. But when you&#39;re innocent, when that&#39;s not happened, then there&#39;s got to be a place that it stops. And I&#39;m you said to me that it&#39;s kind of like you&#39;re foretelling that this marriage is gonna be over with, that it&#39;s, it&#39;s spinning so much out of control right now that you that it&#39;s just not right, doesn&#39;t feel right, and, and you&#39;re not good with it, correct. That&#39;s a yes or no question.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />Yeah.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Okay. All right. Now, what&#39;s your story in this? What, what is your story in this? Are you willing to let all of this outside pressure just spin your marriage off into the ditch?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />No, I&#39;m not, I don&#39;t want this to happen. I mean, I love her more than anything, and this has just been so devastating. And I&#39;ll do anything to keep this together.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Because let me tell you something. I see couples oftentimes do what I call non-directional frustration. It&#39;s kind of like you can have all of these frustrations at work, with your family, with your exes, with finances, or whatever. But yet you don&#39;t aim at there. You aim it at each other. Don&#39;t you all -- you know what I&#39;m talking about. You know what I&#39;m talking about. It&#39;s like you&#39;re handy, you&#39;re just handy. If you&#39;re frustrated, who are you gonna turn on? You&#39;re not gonna turn on the guy down at the 7-Eleven. You don&#39;t even know him, and he don&#39;t want to hear it. You know he&#39;s not gonna pay attention to it. So you do it with your spouse. You do it with your mate. And the enemy here is not David, the enemy here is not Destiny. The enemy here is an outside force outside the marriage. It&#39;s some problems with the system. It&#39;s false accusations; those are the enemies. But yet you&#39;re fighting amongst yourselves. I mean, don&#39;t you see that? What? -- You can talk now. No, really, what do you think about that? I mean, you&#39;re you guys are fighting among yourselves.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />I know, and a lot of it is over. Little things will escalate into a big, huge fight, and they&#39;re starting to get more vile as they go on. But sometimes I feel like when she gets thrown up in my face again when something happens, I feel like sometimes he just downplays it or protects her in some way. He&#39;s never once said one negative thing towards her or expressed any anger towards her or anything. It&#39;s just like, well, this is how she is, you know.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Arguing with her, you know, I know if I ever got on her bad side. She&#39;d get back at me. That&#39;s why I was afraid when Destiny, (crosstalk) my ex, got in a fight on the phone. Soon thereafter, we&#39;re called by the police.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Yeah. That&#39;s right. And so, I mean, she&#39;s taught you how to treat her, right?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Yeah.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />I mean, this other person has said, &quot;You want to jack with me? I&#39;ll bring the forces of hell down on you, boy.&quot;</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Exactly.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />And so and so, you just like I don&#39;t, I don&#39;t want to start something. I don&#39;t want to make it worse.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />I understand that.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />But he has a reason. He has a reason for these things. But the point is, instead of fighting about this, you&#39;ve got to work the problem. You guys have a problem here, and it hasn&#39;t gone away. But you&#39;ve got to work the problem. You can&#39;t let the problem become divisive between you. You&#39;ve got to say, look, we&#39;ve been frustrated with each other, we&#39;ve been blaming each other. We&#39;ve been letting someone else control and dictate our marriage. Let&#39;s resolve not to do that; let&#39;s resolve to work the problem together. Tell me what you need, tell her what you need, and instead of judging that, and yeah, but, yeah, but, yeah, but take &#39;Yeah But&#39; out of your vocabulary. Listen to each other and come up with a plan that both of you can say, &quot;That works for me, that meets my needs.&quot; And if the only time you ever talk about this is when you&#39;re in a fight, that won&#39;t work. You&#39;ve got to talk about it peacefully, you&#39;ve got to talk about it strategically, and say, let&#39;s get a plan right, your needs down, and give it to him. Sometimes, men, we&#39;ve got to like, see this and hear it four or five times. Write them down and give it to &#39;em. And then read it, okay. Read it, all of it. Okay. You&#39;ll find out around here. I&#39;m not through until I&#39;m through. I have more to say to Destiny and David backstage. We&#39;ll be right back.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Closed captioning provided by. The reason I wanted to talk to you is you said something to me right at the end, and I don&#39;t know if you&#39;re getting what I&#39;m saying or not, but right at the end, you said what to me.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />I said, &quot;I&#39;m beginning to hate him, almost. I&#39;m resentful.&quot; And I told him the other day that I hated him, and I don&#39;t, but I hate my situation so much that I can&#39;t even think rationally anymore.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Well, so what are you saying you want to do? Do you want out of this marriage?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />No.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Is that what you&#39;re saying?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />No, I mean no, but I&#39;m tired of fighting. I&#39;m tired of this woman. Tired of being called on the police department. I&#39;m tired of not having any food in my house. I&#39;m tired of not being able to buy my baby anything. I&#39;m tired of being talked about at work. I just all around, she&#39;s destroyed me. In 18 months, I am destroyed. I&#39;ve only been married for two years and we didn&#39;t even spend our. Our second anniversary was Labor Day, and we didn&#39;t even spend it together. We didn&#39;t even get each other anything. I&#39;ve only been married for two years.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />So what do you hear her saying?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />I understand, I just I wish I could do something right now, but, I mean, I can, but it&#39;s just been so much, so much stress. And I&#39;m sorry. I really want to work this out. I will do whatever I can. It&#39;s just it&#39;s been devastating to us and just a lot of pressure, and I maybe I deal with it the wrong way. I need to stand up and face things instead of back down. And I realize that&#39;s what she wants. But so far, I&#39;ve just been beaten down so many times, it&#39;s hard to get up.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />But do you have a lawyer?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Yes, I do.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />Have three lawyers.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />We&#39;ve been through three and --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Nothing happens --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />It&#39;s just it goes on and on. I want something to happen quicker, and it just continues to go on. I mean, hopefully we&#39;ll see an end of this.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />But, you know, it strikes me very clearly that you definitely are feeling very much alone here.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />I am.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />You&#39;re feeling like this person has come in from the outside. They&#39;ve taken away your happiness. They&#39;ve taken away your home. They&#39;ve taken away your dream. They&#39;ve taken away your marriage. And, and in that, they&#39;ve taken away your happiness and --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />My husband totally changed; he ignores me. He gets on the computer for hours; he doesn&#39;t want to help me around the house. I work just as much as he does. I stay up all night long at work, come home. I&#39;m up all day with a baby, I can&#39;t afford childcare. I am so tired of doing everything I do, everything in my house, and all his. Everything goes to that woman. Whole life around her.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />And do you hear what she&#39;s saying? And I understand what&#39;s happening with you. I understand that your way of dealing with this is like, okay, I just I&#39;ll just lose myself in this computer, I&#39;ll lose myself in work. I&#39;ll lose myself in whatever. But you can&#39;t do that, you can&#39;t do that. If you do, it&#39;s gonna cost you your marriage, it&#39;s gonna cost you your wife. It&#39;s gonna cost you everything that you have put together at this point. And you&#39;re giving that away, you&#39;re giving that power away to somebody else, you cannot do that. You have got to plug in here. You&#39;ve got to stop being passive and start actively working the problem. She feels alone, she feels lonely, she feels alone, and she needs you to plug back in. She cannot navigate this anymore. Her coping energies are spent. She&#39;s saying, &quot;I&#39;ve run out of coping energy, I can&#39;t do this. I don&#39;t have it, I just can&#39;t do this alone. I need him back in the game.&quot; Isn&#39;t that what you&#39;re saying? And she&#39;s getting to the point that she resents this other woman for what she&#39;s doing, and she resents you for allowing it.
And she&#39;s saying, step up and protect me. I am your wife. Protect me, protect your daughter. Plug into our family and take care of us. And whatever you have to do, whatever you have to do with lawyers, whatever you have to do to get this thing turned around. You&#39;ve got to get active in this, and you&#39;ve got to give him a chance to do that. Don&#39;t seal his fate by saying, &quot;It&#39;s over, it&#39;s over.&quot; There&#39;s not anything he can do. You&#39;ve got to let him plug into this and let this be a beginning. Let coming here let, let, let, coming here. Let&#39;s be on this show. Let this be the point in your life where you took a right turn and you got back in the game and, and allow yourself to have some hope and optimism again. You got some help here.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />I know.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />You got some resources here. And you&#39;ve got to step up and do it. And we&#39;re gonna follow you all and see what happens.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Thank you very much.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Okay, now will you do it?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />Yes, I will do whatever it takes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Will you give him the chance to do what he has to do?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />I&#39;ll do whatever it takes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />And step-up --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />This was the first step, I just knew coming here, just speaking about it. I mean, I feel more confident, and I will work, work really hard with this.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />All right.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>David 01036: </strong><br />Thank you.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Thanks so much.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />Thanks.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Thanks, guys.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Destiny 01036: </strong><br />Thanks.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />I&#39;ll be watching y&#39;all. Next, a couple whose lives were destroyed when the husband was accused of trying to murder his wife.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I was being poisoned.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Today, we&#39;re talking about the pain of being falsely accused. Tom and Lynn have lived this tragedy when Tom was falsely accused of trying to murder his own wife.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I was extremely excited to build my dream home, so we started with the deck.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />She would be underneath. She would be holding the board. I&#39;d be up on the deck, and I&#39;d be sawing it. After two weeks, Lynn got sick.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I started throwing up, but I thought I had food poisoning. The doctors could not find out what was wrong. I think it was the sixth trip that I made my doctor sit down, and he told me that I was being poisoned with arsenic.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />The hospital notified police department. They came out.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />All the questioning that was directed at me was, &quot;Why would Tom try to kill you?&quot;</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />I felt like the police were, were convinced that I was the person that was trying to kill my wife.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I spent a week wondering who would try to poison me. I didn&#39;t suspect Tom.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />The state investigators could not find any proof. The FBI questioned us twice. He said that he understood that we were building a house. And he asked, &quot;Were we using treated lumber?&quot; And I said, &quot;Well, sure.&quot; He took hair samples from Lynn. They took hair samples from me. The results came back. Not only was Lynn being poisoned because I was too, and it was the treated lumber that was the source. This had gone to the grand jury as an attempted murder, and that the grand jury dismissed it. The House will never be finished. There&#39;s too much arsenic inside. I have been extremely depressed. I think about it constantly. Throw that in with the fact that there are some people that still believe that I tried to kill my wife, my reputation is basically shot.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I&#39;d like to ask Dr. Phil what the best way for me to help Tom cope. And I&#39;m basically all he has, and I want to help him.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />So this has just been a terrible time.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />It&#39;s been a very bad time.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Tell me, Tom, how does it feel to walk in a room knowing that there are people over there who are thinking, That&#39;s the guy that tried to kill his wife?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Basically just tears your heart out. I grew up in this town, and a small town, a lot of people talk. They, you know, I walk in a room and I can feel them pointing, talking. Well, they&#39;ll speak to me, but as soon as they get through speaking to them, they&#39;ll turn to the person next to them, and I can -- I just I can imagine what they&#39;re saying is, you know, he tried to kill his wife.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />So what&#39;s it, what&#39;s it doing to y&#39;all&#39;s relationship? I mean, anytime you put stress and pressure on, I know it&#39;s got to hurt. And you guys are now living in this little trailer.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />We&#39;ve been living in this little trailer for four years, and you put that kind of stress, along with the stress of going through the investigation of them, trying to convince me that my husband tried to kill me. And it&#39;s, we are doing really good just to survive day to day. We&#39;re doing really good just to be able to function.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />So they came to you in the hospital, the police, the authorities, and kind of said, you know, looking over the shoulder, hey, your husband&#39;s tried to poison you here.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />The hospital authorities notified the local authorities in the town where we live. And the local authorities were at our house within an hour after I got home from the hospital.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Did you suspect, I mean, did they, did they convince you that this may have happened? I mean, did they get you? Because, I mean, I suppose you&#39;d have to wonder. Did it ever cross your mind that maybe he had didn&#39;t like your cooking or something? Try trying to get even --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I was never convinced that my husband was trying to kill me. I was convinced that someone was trying to kill me. My greatest fear was that we would never know who it was or what it was.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Now they took you all to the grand jury, right?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />Right.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />They took this case to the grand jury and tried to get you indicted.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Yes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Did they tell you they were taking it to the grand jury?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />No.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />So you didn&#39;t even know?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />I didn&#39;t know it until after it came out in a newspaper article.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />So you read it in the newspaper?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Yes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />That&#39;s -- Let&#39;s see who won, whoa. So you saw in the newspaper that they had taken you in there with a charge of attempted murder. What did you face if you had been convicted of attempted murder? I mean, how many years were you? Was this, like, 20 years? 30 years life? What is it?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />15 to life, I imagine.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />15 to life?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Yeah.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Alright. So how did you get? --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />I&#39;m not very good at close quarters. That 30-foot travel trailer just is not, you know --</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Yeah, well, of course, my, -- the thing that It frustrates me so much about this for y&#39;all is this happens when it when you were vindicated. And at this point, there is absolutely no question, no doubt, that you didn&#39;t try to poison your wife. Correct?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Correct.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Because they have found out that this treated lumber has arsenic in it. And in fact, you had higher levels than she did. That was in the tape piece, right?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Right.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Y&#39;all get that? Y&#39;all, y&#39;all get that, both? So you were trying to poison yourself, too? Well, what, what genius decided to not check you out &#39;cause you were having fever and not feeling well? Also, did they not think that maybe somebody was trying to poison both of you?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Well, the focus was mainly that my wife was sick. They didn&#39;t look at me being sick. They were looking at trying to pin attempted murder rap on me. Instead of looking at whether or not I was sick.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />But see, we live -- the problem that I have with this. And I think you guys are the same way. We live in what I call a sound bite society. I mean, people say, okay, look here. Headline-breaking story, whatever. Man tries to poison wife. Okay, so that&#39;s etched in their brain. And what is it that we want to believe these things? What is it that we just want to believe the worst about each other? So that hits the newspaper, and it gets all over town, I&#39;m sure, like a wildfire. So when it was obvious that it wasn&#39;t the case that both of you were being affected by this treated, wood I assume they called a town meeting down in the town square and said, &quot;We just want to set the record straight, he didn&#39;t do anything wrong, and we want to apologize to you.&quot; And I assume there was a three-inch screamer headline in the paper the next day. &#39;Man totally vindicated of all charges.&#39; I assume that all happened, right?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Never.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />No.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Never.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />No.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />It&#39;s still the case. Is still open. According to the city.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />The case is still open?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />It has not been closed.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Do you know why?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />I have no, no clue. Oh, my family has been there for generations. This would have would have really made the headlines for, for the city, you know, prominent citizen accused, you know, convicted of attempted murder on his wife.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />What do you want to see happen? What? What would it take in your town, in your community, in your life, to turn this clock back or unravel this in some way? To give you some peace of mind, give you some life back?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I&#39;d like for the city and the police department to come forth and tell us that. No, my husband did not try to murder me. That everyone recognizes what the FBI came up with, that it was the treated lumber. The timeline presented by the FBI, the hair samples that they took from us.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />So you want that aired out?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />Yes.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />You want people to know that? Just, that just -- well, gee, golly darn, we&#39;re just too busy to prosecute him right now. You want them to know what you want people to know what the truth is?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I want people to know. They should know what the truth is.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Well, we&#39;re gonna work on that in just a minute. I&#39;m gonna tell Tom and Lynn why they&#39;re actually in mourning, and how Tom may, in fact, have gotten that prison sentence that he wished had gone away when we come back.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Announcer: </strong><br />Are you or your child suffering from the trauma of date rape? Were you raped by an acquaintance and don&#39;t know where to turn for help? Call (323) 520-7445 or log on to DrPhil.com.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Today, we&#39;re talking about the pain of being falsely accused, and it is a serious pain. Tom was wrongly charged with attempted murder in trying to poison his wife with arsenic, and says their lives have just been devastated since that time. Now, look, there&#39;s no way that we can erase what&#39;s happened, right? I mean, you get that. But if is there, -- is there anything anybody can do at this point? Is there anybody in the in the community, anybody with the authorities? Is there anything they can do that will ever make this okay? It would help. But would it ever make, make it okay what you went through?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />It could never make it okay.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Yeah. So why is it important for you to do it?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Lynn 01036: </strong><br />I think we have to have some closure in order to get on with the rest of our lives.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Yeah, well, I agree with that. But where are you gonna get that? I mean, maybe they&#39;ll see this show, and maybe they&#39;ll hear that the thing they need to do is step up and admit a mistake. But then maybe they won&#39;t. But I mean, isn&#39;t this really up to you guys to put this behind you?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Yeah.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />You know, there&#39;s something that -- and I bet you guys will recognize this when you hear it. You know, we always hear about guilt by association.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Right.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />That is, if you kind of roll with pigs, you&#39;re gonna get muddy. But there&#39;s something else that we don&#39;t talk about much. That&#39;s called guilt by accusation. Guilt by accusation, and isn&#39;t there a, you know, I said to you guys, when you hear something, a part of you believes it. It&#39;s just kind of like we tend to just knee-jerk react. And a phenomenon that I&#39;ve seen in, in human beings is if you accuse them of something that they know they didn&#39;t do. There&#39;s still a little twinge of guilt just by having the finger pointed at you, isn&#39;t there? Did you feel that?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Oh, yes, all the time. You know, it&#39;s not -- I said that I didn&#39;t do it. Well, not my wife said that I didn&#39;t do it. You still feel that people are still behind you, pointing and saying.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />Yeah, kind of whispering behind you and all that kind of stuff. And so the point is that what I&#39;m saying is a big part of this, that closure you&#39;re talking about has to happen with you guys, because you&#39;re still reacting to what you think people may be thinking about you, and they may.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />Yeah.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />And you know what? If they are, they just are. But there&#39;s a point at which you&#39;ve got to say the prison that you live in, if you let yourself be intimidated, if you let yourself feel guilty by accusation. If you feel like you could shrink away because of what people may think about you, then you&#39;ve put yourself in prison. You&#39;ve put yourself in an emotional prison where you don&#39;t hold your head up walking down the street. You don&#39;t feel the sense of, of freedom and rightness about what you&#39;re doing. There comes a point where you&#39;ve got to say to yourself, you know what, &quot;I, Tom, know the truth, and I know that, and I&#39;ll know that till the day I die. And I&#39;m gonna give myself what I wish I was getting from the community. I wish the community had the guts, had the backbone. The people who whisper behind my back and point don&#39;t really know. Just read a headline or heard it over at the Tastee Freez.&quot; And you know everything from the Tastee Freez is this gospel, right? And everything you heard at church, you know, it was it was whispered about in the parking lot at church. It&#39;s got to be true. You know, those people, they ought to come and say, hey, listen, I got caught up in this. I just didn&#39;t know. But I want to look you in the eye and tell you that I&#39;m sorry. You&#39;ve been through this, and I wish you well. And I want to be your friend. Wouldn&#39;t that be nice?</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Tom 01036: </strong><br />It would help a lot.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />And maybe they&#39;ll do that. But if they don&#39;t, you&#39;ve got to do it for yourself. You&#39;ve got to do it for yourself. You&#39;ve got to step up and say, I&#39;m taking my power back. These people don&#39;t pay my rent. These people don&#39;t come over and clean my house. My 35-foot shoebox house. I got left after all this happened. These people don&#39;t do that. So you know what? I&#39;m not gonna give them the power to pick my feelings. You know? They&#39;re wrong. They&#39;re absolutely wrong, and you&#39;re right. And you got to say, I&#39;m not gonna let them do that. I&#39;m gonna look myself in the mirror and give myself what I wish I was getting from somebody else. And maybe the paper will have the nerve to run something that, that says, &quot;Hey, we&#39;re gonna, we&#39;re gonna rally behind our guy. We&#39;re gonna set the record straight. Maybe that preacher will stand up at the pulpit up there and say, &quot;Hey, we got something bad that&#39;s happened in our community, and we want to do the right thing.&quot; You know, maybe the paper will do it, maybe the pastor will do it. Maybe your friends will step up and do it. But if and until they do, you&#39;ve got to do it for yourself. You&#39;ve got to give it to yourself and give it to each other. Will you do that? And I spent a lot of time in the legal arena. I spent a lot of time in the legal arena. That&#39;s like my day job. I look this, I look this thing over top, side, and bottom. And these people owe you folks a big apology, let me tell you. Okay. Next, I&#39;m gonna talk to you about what happened to me when I first walked into a grocery store and saw my face on a tabloid, accused of all kinds of nefarious and lascivious deeds. I&#39;ll tell you the decision I had to make before I committed to doing this show. We&#39;re talking to people who are the victims of false accusations and how they can move on from all the gossip. This is something I can relate to because I can tell you when I took the step into public life, which had been like really private before, I fastly learned that the more recognizable you become, the more interesting you are in the tabloids. These rags that you see all over the place and and I had to make a decision. And the decision was to take my power back. It&#39;s amazingly unfair to private citizens to be subjected to all this stuff. But when you step into the public arena, I kind of expect that it was a serious decision. It&#39;s kind of the ying and yang, because in America, we tend to build people up and then tear them down, and it has nothing to do with whether you do something right or whether you don&#39;t. I mean, you&#39;re falsely accused of murder. You&#39;re falsely accused of, of arson, whatever it might be. And, and for me, I had to make a decision. Because if your face will sell newspapers, they&#39;re gonna write about you. And the decision I made was, I know the truth.
And the truth is, I&#39;m probably one of the most boring guys you&#39;ve ever seen in your life. But if it&#39;ll sell papers, they&#39;re gonna be there. I&#39;ve been accused of everything from the Irish potato famine to a romance with Mae West. I mean, I -- there was a story that a guy refused to sell me a newspaper on the street, a newspaper guy, because I had his wife so up in arms about their marriage. I never bought a newspaper on the street in my life. Stories about me being the one that stands between Oprah and Stedman, or -- I mean, for God&#39;s sake, you know, teen scandals. There&#39;s been things in there about me in starting this show, throwing chairs. And then I saw one recently where Oprah and I are taking long walks on her farm, hand in hand. If you knew my knees, I don&#39;t walk anywhere. But you just have to roll with it. And I made a decision that if you stop to defend yourself and you react to that, you&#39;re giving them the power and getting them to get you to take your eye off the ball. And I&#39;ve often said you wouldn&#39;t worry so much about what people thought of you if you knew how seldom they did. We&#39;ll be right back. For more info, log on to DrPhil.com. Get tickets. Be on the show. Get your questions answered all on DrPhil.com.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Announcer: </strong><br />Guests of the Dr. Phil show stay at the Renaissance Hollywood Hotel, the destination for luxury and comfort. Just steps away from Hollywood and Highland and the star-studded Walk of Fame.</p><p style="font-size: 14px;color: #3E3E3B;text-decoration: none;"><strong>Dr. Phil: </strong><br />If you&#39;re in L.A. and would like to be part of the studio audience, call us for tickets at (323) 461-Phi, that&#39;s (323) 461-7445. I wanna thank my guests for having the courage to come here today and stand up and say, I ain&#39;t going away. I am who I am, and I make no apology for it. My hope is that all of you
